<!DOCTYPE html>
<html lang="en" mode="md">
  <head>
    <meta charset="utf-8" />
    <title>KaytetyEmoji</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="shortcut icon" type="image" href="%PUBLIC_URL%/assets/start_header_no.webp" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      /* Full-screen splash artwork, shown before React loads and faded out from App.tsx */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #d47732 url('%PUBLIC_URL%/assets/splash.webp') center / cover no-repeat;
        transition: opacity 300ms ease-out;
      }
      #app-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="app-splash"></div>
    <div id="root"></div>
  </body>
</html>
